<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Портфель — симулятор ВТБ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Главный экран -->
    <header class="header">
      <div class="portfolio-sum">105 ₽</div>
      <div class="portfolio-change">
        <span>+1 ₽ · 1,16%</span>
        <span class="period">за всё время</span>
      </div>
    </header>

    <div class="stories" id="stories">
      <div class="story">До 16% годовых</div>
      <div class="story">Сохранность: +50%</div>
      <div class="story">Портфель для ребёнка</div>
      <div class="story">Топ-10 акций</div>
      <div class="story">Валютные облигации</div>
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab" id="tab-actions" data-tab="actions">Действия</button>
      <button class="tab tab--primary" data-tab="history">История</button>
      <button class="tab" data-tab="analysis">Анализ</button>
      <button class="tab" data-tab="accounts">Счета</button>
      <button class="tab" data-tab="favorites">Избранное</button>
    </nav>

    <section class="accounts" id="accounts">
      <button class="account-row" data-account="broker">
        <div class="account-info">
          <div class="account-name">Брокерский счёт</div>
          <div class="account-number">№ 40817810...0117</div>
        </div>
        <div class="account-values">
          <div class="account-sum">61 ₽</div>
          <div class="account-change positive">+0,57 ₽ · 0,89%</div>
        </div>
      </button>

      <button class="account-row" data-account="iis">
        <div class="account-info">
          <div class="account-name">ИИС</div>
          <div class="account-number">№ 40817810...0245</div>
        </div>
        <div class="account-values">
          <div class="account-sum">38 ₽</div>
          <div class="account-change positive">+0,62 ₽ · 1,65%</div>
        </div>
      </button>

      <button class="account-row" data-account="savings">
        <div class="account-info">
          <div class="account-name">Инвесткопилка</div>
          <div class="account-number">№ 40817810...0398</div>
        </div>
        <div class="account-values">
          <div class="account-sum">4 ₽</div>
          <div class="account-change positive">+0,01 ₽ · 0,25%</div>
        </div>
      </button>

      <button class="account-row" data-account="funds">
        <div class="account-info">
          <div class="account-name">Фонды ВИМ</div>
          <div class="account-number">№ 40817810...0512</div>
        </div>
        <div class="account-values">
          <div class="account-sum">2 ₽</div>
          <div class="account-change negative">-0,20 ₽ · 0,32%</div>
        </div>
      </button>
    </section>

    <button class="configure-btn" id="configure-btn">Настроить вид экрана</button>

    <nav class="bottom-nav">
      <button class="nav-item" data-nav="search">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        Поиск
      </button>
      <button class="nav-item" data-nav="quotes">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"></polyline><polyline points="15 6 21 6 21 12"></polyline></svg>
        Котировки
      </button>
      <button class="nav-item active" data-nav="portfolio">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        Портфель
      </button>
      <button class="nav-item" data-nav="chat">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-4.2-7.6"></path><path d="M21 3v6h-6"></path></svg>
        Чат
      </button>
    </nav>
  </div>

  <!-- Затемнение -->
  <div class="backdrop" id="backdrop"></div>

  <!-- Шторка «Действия» -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grabber"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="sheet-title">Действия</div>
      <button class="sheet-close" id="sheet-close" aria-label="Закрыть">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="3" y1="3" x2="13" y2="13"></line><line x1="13" y1="3" x2="3" y2="13"></line></svg>
      </button>
    </div>
    <div class="sheet-body">
      <div class="sheet-block">
        <div class="sheet-block-title">Пополнения и выводы</div>
        <div class="sheet-block-list">
          <button class="sheet-row" data-action="Пополнить">
            <span class="sheet-row-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </span>
            <span class="sheet-row-label">Пополнить</span>
            <span class="sheet-row-chevron">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
            </span>
          </button>
          <button class="sheet-row" data-action="Между счетами">
            <span class="sheet-row-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"></path><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><path d="M7 21l-4-4 4-4"></path><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
            </span>
            <span class="sheet-row-label">Между счетами</span>
            <span class="sheet-row-chevron">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
            </span>
          </button>
          <button class="sheet-row" data-action="Вывести">
            <span class="sheet-row-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            </span>
            <span class="sheet-row-label">Вывести</span>
            <span class="sheet-row-chevron">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
            </span>
          </button>
        </div>
      </div>

      <div class="sheet-block">
        <div class="sheet-block-title">Услуги и действия со счётом</div>
        <div class="sheet-block-list">
          <button class="sheet-row" data-action="Маржинальная торговля">
            <span class="sheet-row-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10"></path><path d="M12 8v4l3 3"></path><path d="M17 2l4 4"></path><path d="M21 2l-4 4"></path></svg>
            </span>
            <span class="sheet-row-label">Маржинальная торговля</span>
            <span class="sheet-row-chevron">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
            </span>
          </button>
          <button class="sheet-row" data-action="Отчеты и справки">
            <span class="sheet-row-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="9" y1="13" x2="15" y2="13"></line><line x1="9" y1="17" x2="13" y2="17"></line></svg>
            </span>
            <span class="sheet-row-label">Отчеты и справки</span>
            <span class="sheet-row-chevron">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Демо: действие недоступно</div>

  <script src="script.js"></script>
</body>
</html>
